buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://libraries.minecraft.net" }
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven {
            name = "anatawa12-repo"
            url = "https://repo.anatawa12.com/maven/"
        }
        maven { url = "https://jitpack.io" }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') { changing = true }
    }
}

apply plugin: 'forge'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
version = "3.0"
group = "com.bot.recorder"
archivesBaseName = "Recorder"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    mappings = "stable_12"
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url = "https://jitpack.io" }
}

// ForgeGradle 1.2 can leave getAssets.index unset when run under newer Gradle.
// Load the 1.7.10 asset index explicitly so setupDevWorkspace/runClient pass task validation.
afterEvaluate {
    tasks.getAssets.setIndex({
        File indexFile = new File(gradle.gradleUserHomeDir, "caches/minecraft/assets/indexes/1.7.10.json")
        if (!indexFile.exists()) {
            indexFile.parentFile.mkdirs()
            File bundledIndex = file("gradle/assets/1.7.10.json")
            if (!bundledIndex.exists()) {
                throw new GradleException("Missing bundled Minecraft 1.7.10 asset index: " + bundledIndex)
            }
            indexFile.bytes = bundledIndex.bytes
        }
        return net.minecraftforge.gradle.json.JsonFactory.loadAssetsIndex(indexFile)
    } as groovy.lang.Closure)
}
